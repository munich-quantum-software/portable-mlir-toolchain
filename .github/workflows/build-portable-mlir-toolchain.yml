name: 👷 Build Portable MLIR Toolchain

on:
  workflow_dispatch:
    inputs:
      llvm-project-ref:
        description: "llvm-project ref or tag (e.g., llvmorg-23.1.4)"
        default: "llvmorg-23.1.4"
        required: true
        type: string
      release:
        description: "Whether to create a GitHub release with the built artifacts"
        required: true
        type: boolean
      release-tag:
        description: "Tag for the GitHub release (e.g., 2026.10.28)"
        required: true
        type: string
      release-notes:
        description: "Release notes for the GitHub release"
        required: true
        type: string
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-detection:
    name: 🕵️ Check
    runs-on: ubuntu-slim
    outputs:
      run-linux: ${{ steps.changes.outputs.run-linux }}
      run-macos: ${{ steps.changes.outputs.run-macos }}
      run-windows: ${{ steps.changes.outputs.run-windows }}
      llvm-project-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check orchestration helpers
        run: bash tests/test-ci.sh
      - name: Select affected platforms (including deleted and renamed paths)
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA"
          else
            printf 'scripts/toolchain/common.sh\0'
          fi | bash scripts/ci/changed-platforms.sh >> "$GITHUB_OUTPUT"
      - name: Resolve LLVM source once
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_REF: ${{ inputs.llvm-project-ref || 'llvmorg-23.1.4' }}
        run: |
          [[ "$LLVM_REF" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Use a tag, SHA, or branch without slashes'; exit 1; }
          sha=$(gh api "repos/llvm/llvm-project/commits/$LLVM_REF" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Verify release tag before building
        if: inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: bash scripts/ci/verify-release-tag.sh

  linux:
    needs: change-detection
    if: fromJson(needs.change-detection.outputs.run-linux)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    uses: $/.github/workflows/build-mlir-linux-runner.yml
    with:
      runs-on: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      llvm-project-ref: ${{ inputs.llvm-project-ref || 'llvmorg-23.1.4' }}
      llvm-project-sha: ${{ needs.change-detection.outputs.llvm-project-sha }}

  macos:
    needs: change-detection
    if: fromJson(needs.change-detection.outputs.run-macos)
    uses: $/.github/workflows/build-mlir-macos-runner.yml
    with:
      runs-on: macos-26
      llvm-project-ref: ${{ inputs.llvm-project-ref || 'llvmorg-23.1.4' }}
      llvm-project-sha: ${{ needs.change-detection.outputs.llvm-project-sha }}

  windows:
    needs: change-detection
    if: fromJson(needs.change-detection.outputs.run-windows)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    uses: $/.github/workflows/build-mlir-windows-runner.yml
    with:
      runs-on: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      llvm-project-ref: ${{ inputs.llvm-project-ref || 'llvmorg-23.1.4' }}
      llvm-project-sha: ${{ needs.change-detection.outputs.llvm-project-sha }}

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - linux
      - macos
      - windows
    runs-on: ubuntu-slim
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{ !fromJson(needs.change-detection.outputs.run-linux) && 'linux,' || '' }}
            ${{ !fromJson(needs.change-detection.outputs.run-macos) && 'macos,' || '' }}
            ${{ !fromJson(needs.change-detection.outputs.run-windows) && 'windows,' || '' }}
          jobs: ${{ toJson(needs) }}

  release:
    needs: [linux, macos, windows]
    if: ${{ inputs.release == true }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download zstd artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zstd-*.tar.gz
          path: artifacts
      - name: Download MLIR artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: llvm-mlir_*.tar.zst
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: |
          bash scripts/ci/verify-release-tag.sh
          gh release create "$RELEASE_TAG" --verify-tag \
                            artifacts/**/* \
                            --title "Portable MLIR Toolchain $RELEASE_TAG Release" \
                            --notes "$RELEASE_NOTES"
