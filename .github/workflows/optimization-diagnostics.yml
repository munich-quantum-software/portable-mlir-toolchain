name: Diagnose macOS study exception handling

on:
  workflow_dispatch:
  push:
    branches: [codex/optimized-release-toolchain]
    paths: [.github/workflows/optimization-diagnostics.yml]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: munich-quantum-toolkit/core
          fetch-depth: 0
          ref: 65ee323df7ab5aa8854e9d857e9d5b2819f050d1
          path: core
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: "34535974767"
          github-token: ${{ github.token }}
          name: study-sdk-macos-arm64-OFF
          path: ${{ runner.temp }}/study/download
      - name: Expose the failed assertion's actual error
        shell: bash
        env:
          STUDY_ROOT: ${{ runner.temp }}/study
          STUDY_OPERATION: wheel
          STUDY_SDK_LTO: "OFF"
          STUDY_CORE_LTO: "OFF"
          STUDY_JOBS: "3"
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          cat > "$STUDY_ROOT/exception.cpp" <<'CPP'
          #include <cstdio>
          #include <exception>
          #include <stdexcept>
          static void report(const std::exception_ptr& exception) {
            try { std::rethrow_exception(exception); }
            catch (const std::exception& error) { std::printf("standard exception: %s\n", error.what()); }
            catch (...) { std::puts("unknown exception"); }
          }
          int main() {
            try { throw std::out_of_range("known diagnostic marker"); }
            catch (...) { report(std::current_exception()); }
          }
          CPP
          for flag in -fno-rtti -frtti; do
            xcrun clang++ -O3 -std=c++20 -mmacosx-version-min=13.3 "$flag" "$STUDY_ROOT/exception.cpp" -o "$STUDY_ROOT/exception$flag"
            "$STUDY_ROOT/exception$flag" | tee "$STUDY_ROOT/exception$flag.log"
          done
          cat > "$STUDY_ROOT/exception-throw.cpp" <<'CPP'
          #include <stdexcept>
          void marker() { throw std::out_of_range("known diagnostic marker"); }
          CPP
          cat > "$STUDY_ROOT/exception-extra.cpp" <<'CPP'
          #include <exception>
          void check(void (*call)()) {
            try { call(); } catch (const std::exception&) {}
          }
          CPP
          xcrun clang++ -O3 -std=c++20 -mmacosx-version-min=13.3 -dynamiclib "$STUDY_ROOT/exception-throw.cpp" -o "$STUDY_ROOT/exception-throw.dylib"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['STUDY_ROOT']) / 'exception.cpp'
          source = path.read_text().replace('int main() {', 'void marker();\nint main() {')
          source = source.replace('throw std::out_of_range("known diagnostic marker")', 'marker()')
          path.write_text(source)
          PY
          for flag in -fno-rtti -frtti; do
            xcrun clang++ -O3 -std=c++20 -mmacosx-version-min=13.3 -fvisibility-inlines-hidden "$flag" -c "$STUDY_ROOT/exception-extra.cpp" -o "$STUDY_ROOT/exception-extra.o"
            xcrun clang++ -O3 -std=c++20 -mmacosx-version-min=13.3 -frtti "$STUDY_ROOT/exception.cpp" "$STUDY_ROOT/exception-extra.o" "$STUDY_ROOT/exception-throw.dylib" -o "$STUDY_ROOT/exception-mixed$flag"
            "$STUDY_ROOT/exception-mixed$flag" | tee "$STUDY_ROOT/exception-mixed$flag.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core/mlir/unittests/Compiler/test_compiler_qdmi_adapter.cpp')
          source = path.read_text()
          old = 'EXPECT_NE(message.find("Unknown QDMI device ID"), std::string::npos);'
          assert source.count(old) == 1
          path.write_text(source.replace(old, old[:-1] + ' << message;'))
          path = Path('core/mlir/CMakeLists.txt')
          source = path.read_text()
          old = '  mqt_llvm_target_disable_rtti(${target_name})\n'
          assert source.count(old) == 1
          path.write_text(source.replace(old, ''))
          path = Path('core/mlir/lib/Compiler/QDMIAdapter.cpp')
          source = path.read_text()
          old = 'return qdmiError(action, "unknown exception");'
          assert source.count(old) == 1
          diagnostic = 'auto* type = __cxxabiv1::__cxa_current_exception_type(); std::fprintf(stderr, "DIAGNOSTIC exception type: %s\\n", type ? type->name() : "foreign"); '
          path.write_text('#include <cxxabi.h>\n#include <cstdio>\n#include <typeinfo>\n' + source.replace(old, diagnostic + old))
          PY
          git -C core diff > "$STUDY_ROOT/diagnostic.patch"
          python3 experiments/linux_optimization.py --output "$STUDY_ROOT/pipeline.json" -- bash experiments/run.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-macos-exception-diagnostic
          path: |
            ${{ runner.temp }}/study/diagnostic.patch
            ${{ runner.temp }}/study/exception*
            ${{ runner.temp }}/study/pipeline.*
            ${{ runner.temp }}/study/output/measurements
            ${{ runner.temp }}/study/output/core-build/profile-test-results
            ${{ runner.temp }}/study/output/core-build/compile_commands.json
            ${{ runner.temp }}/study/output/core-build/build.ninja
            ${{ runner.temp }}/study/output/core-build/mlir/unittests/Compiler/mqt-core-mlir-unittests-compiler
            ${{ runner.temp }}/study/output/raw
          if-no-files-found: error
