name: SDK study diagnostic checks

on:
  workflow_dispatch:
    inputs:
      sdk-run-id:
        description: "Validate retained Linux SDK archives; empty diagnoses the macOS Core wheel"
        type: string
        default: ""
  push:
    branches: [codex/optimized-release-toolchain]
    paths: [.github/workflows/optimization-diagnostics.yml]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.sdk-run-id == ''
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: munich-quantum-toolkit/core
          fetch-depth: 0
          ref: 8d520eb04fc301b5dba85a8e4c2587ba410fb533
          path: core
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: "34535974767"
          github-token: ${{ github.token }}
          name: study-sdk-macos-arm64-OFF
          path: ${{ runner.temp }}/study/download
      - name: Retain the failing benchmark CLI and its link map
        shell: bash
        env:
          STUDY_ROOT: ${{ runner.temp }}/study
          STUDY_OPERATION: wheel
          STUDY_SDK_LTO: "OFF"
          STUDY_CORE_LTO: "OFF"
          STUDY_JOBS: "3"
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('core/mlir/bench/CMakeLists.txt')
          with path.open('a') as stream:
              stream.write('\ntarget_link_options(mqt-core-bench PRIVATE "-Wl,-map,${CMAKE_CURRENT_BINARY_DIR}/mqt-core-bench.map")\n')
          PYTHON
          git -C core diff > "$STUDY_ROOT/diagnostic.patch"
          set +e
          python3 experiments/linux_optimization.py --output "$STUDY_ROOT/pipeline.json" -- bash experiments/run.sh
          study_status=$?
          set -e
          python3 - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['STUDY_ROOT'])
          build = root / 'output/core-build'
          paths = [build / 'mlir/bench/mqt-core-bench', *sorted((build / 'mlir/bench').rglob('*.o')),
                   *sorted((build / 'src/bench').glob('*.dylib'))]
          with (root / 'symbols.log').open('w') as stream:
              for path in paths:
                  if path.is_file():
                      print(path, file=stream, flush=True)
                      subprocess.run(['xcrun', 'nm', '-m', str(path)], stdout=stream, stderr=subprocess.STDOUT, check=True)
          with (root / 'dependencies.log').open('w') as stream:
              subprocess.run(['otool', '-L', str(paths[0])], stdout=stream, stderr=subprocess.STDOUT, check=True)
          PYTHON
          exit "$study_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-macos-cli-diagnostic
          path: |
            ${{ runner.temp }}/study/diagnostic.patch
            ${{ runner.temp }}/study/*.log
            ${{ runner.temp }}/study/output/core-build/mlir/bench
            ${{ runner.temp }}/study/output/core-build/src/bench/*.dylib
            ${{ runner.temp }}/study/pipeline.*
            ${{ runner.temp }}/study/output/measurements
            ${{ runner.temp }}/study/output/core-build/profile-test-results
            ${{ runner.temp }}/study/output/core-build/compile_commands.json
            ${{ runner.temp }}/study/output/core-build/build.ninja
            ${{ runner.temp }}/study/output/core-build/mlir/unittests/Compiler/mqt-core-mlir-unittests-compiler
            ${{ runner.temp }}/study/output/raw
          if-no-files-found: error

  validate-linux-sdk:
    if: github.event_name == 'workflow_dispatch' && inputs.sdk-run-id != ''
    strategy:
      fail-fast: false
      matrix:
        assertions: ["ON", "OFF"]
        platform:
          - { runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
          - { runner: ubuntu-24.04, triple: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    env:
      LLVM_ENABLE_ASSERTIONS: ${{ matrix.assertions }}
      SDK_ARCHIVE: llvm-mlir_llvmorg-23.1.0_${{ matrix.platform.triple }}${{ matrix.assertions == 'OFF' && '_noassert' || '' }}.tar.zst
      ZSTD_ARCHIVE: zstd-1.5.7_${{ matrix.platform.triple }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          python-version: 3.14.7
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.sdk-run-id }}
          github-token: ${{ github.token }}
          name: ${{ env.SDK_ARCHIVE }}
          path: ${{ runner.temp }}/sdk-validation
          skip-decompress: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.sdk-run-id }}
          github-token: ${{ github.token }}
          name: ${{ env.ZSTD_ARCHIVE }}
          path: ${{ runner.temp }}/sdk-validation
          skip-decompress: true
      - name: Run the updated installation and BOLT checks
        env:
          STUDY_ROOT: ${{ runner.temp }}/sdk-validation
        run: |
          uv pip install cmake==4.4.3 ninja==1.13.0
          mkdir -p "$STUDY_ROOT/records"
          sha256sum "$STUDY_ROOT/$SDK_ARCHIVE" "$STUDY_ROOT/$ZSTD_ARCHIVE" > "$STUDY_ROOT/records/inputs.sha256"
          python experiments/linux_optimization.py --output "$STUDY_ROOT/records/validate.json" -- \
            bash scripts/toolchain/linux/test-installation.sh \
            -a "$STUDY_ROOT/$SDK_ARCHIVE" -z "$STUDY_ROOT/$ZSTD_ARCHIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-sdk-validation-${{ matrix.platform.triple }}-${{ matrix.assertions }}
          path: ${{ runner.temp }}/sdk-validation/records
          if-no-files-found: error
