name: Build Portable MLIR Toolchain (Windows Runner)

on:
  workflow_call:
    inputs:
      llvm-project-ref:
        description: "llvm-project ref or tag (e.g., llvmorg-23.1.0)"
        required: true
        type: string
      runs-on:
        description: "GitHub runner label (e.g., windows-2022)"
        required: true
        type: string
      zstd-version:
        description: "zstd version (e.g., 1.5.7)"
        default: "1.5.7"
        required: false
        type: string
      ninja-version:
        description: "ninja version (e.g., 1.13.0)"
        default: "1.13.0"
        required: false
        type: string

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  ZSTD_ARCHIVE_PATH: zstd-${{ inputs.zstd-version }}_${{ inputs.runs-on == 'windows-2022' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}.tar.gz
  LLD_ARCHIVE_PATH: lld-${{ inputs.llvm-project-ref }}_${{ inputs.runs-on == 'windows-2022' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}.tar.zst

jobs:
  build-zstd:
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build zstd"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Build zstd (Release)
        shell: pwsh
        env:
          NINJA_VERSION: ${{ inputs.ninja-version }}
          ZSTD_VERSION: ${{ inputs.zstd-version }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\build-zstd.ps1" `
            -ZstdArchivePath $env:ZSTD_ARCHIVE_PATH `
            -NinjaVersion $env:NINJA_VERSION `
            -ZstdVersion $env:ZSTD_VERSION
      - name: Upload zstd executable (final payload)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.ZSTD_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  build-lld:
    needs: build-zstd
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Download zstd executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Build lld (Release) with zstd
        shell: pwsh
        env:
          LLVM_PROJECT_REF: ${{ inputs.llvm-project-ref }}
          NINJA_VERSION: ${{ inputs.ninja-version }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\build-lld.ps1" `
            -LlvmProjectRef $env:LLVM_PROJECT_REF `
            -ZstdArchivePath $env:ZSTD_ARCHIVE_PATH `
            -LldArchivePath $env:LLD_ARCHIVE_PATH `
            -NinjaVersion $env:NINJA_VERSION
      - name: Upload lld installation (temporary)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.LLD_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  build-mlir-release:
    needs: [build-lld]
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build MLIR (Release)"
    env:
      MLIR_ARCHIVE_PATH: llvm-mlir_${{ inputs.llvm-project-ref }}_${{ inputs.runs-on == 'windows-2022' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free up space on runner
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\cleanup-runner.ps1"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Download zstd executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Download lld installation archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.LLD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Build and package MLIR (Release)
        shell: pwsh
        env:
          LLVM_PROJECT_REF: ${{ inputs.llvm-project-ref }}
          NINJA_VERSION: ${{ inputs.ninja-version }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\build-mlir.ps1" `
            -LlvmProjectRef $env:LLVM_PROJECT_REF `
            -ZstdArchivePath $env:ZSTD_ARCHIVE_PATH `
            -LldArchivePath $env:LLD_ARCHIVE_PATH `
            -MlirArchivePath $env:MLIR_ARCHIVE_PATH `
            -NinjaVersion $env:NINJA_VERSION
      - name: Upload MLIR archive (Release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.MLIR_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  test-release:
    needs: [build-mlir-release]
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Test MLIR Installation (Release)"
    env:
      MLIR_ARCHIVE_PATH: llvm-mlir_${{ inputs.llvm-project-ref }}_${{ inputs.runs-on == 'windows-2022' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Download zstd executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Download MLIR archive (Release)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.MLIR_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Test installation (Release)
        shell: pwsh
        env:
          NINJA_VERSION: ${{ inputs.ninja-version }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\test-installation.ps1" `
            -ZstdArchivePath $env:ZSTD_ARCHIVE_PATH `
            -MlirArchivePath $env:MLIR_ARCHIVE_PATH `
            -NinjaVersion $env:NINJA_VERSION
