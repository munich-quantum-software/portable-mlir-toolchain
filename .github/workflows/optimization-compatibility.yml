name: Native SDK Windows compatibility

on:
  workflow_dispatch:
    inputs:
      wheel-run-id:
        description: Reuse repaired wheels from a previous compatibility run
        type: string
        default: ""
  push:
    branches: [codex/optimized-release-toolchain]
    paths: [.github/workflows/optimization-compatibility.yml]

permissions:
  contents: read
  actions: read

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-2025, arch: x86_64, tests: "--full-python-tests" }
          - { runner: windows-11-arm, arch: aarch64, tests: "" }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: munich-quantum-toolkit/core
          fetch-depth: 0
          ref: 65ee323df7ab5aa8854e9d857e9d5b2819f050d1
          path: core
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          python-version: 3.14.7
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: munich-quantum-software/portable-mlir-toolchain
          run-id: "34411299839"
          github-token: ${{ github.token }}
          name: llvm-mlir_llvmorg-23.1.0_${{ matrix.platform.arch }}-pc-windows-msvc_noassert.tar.zst
          path: ${{ runner.temp }}/study/download
          skip-decompress: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.wheel-run-id != ''
        with:
          run-id: ${{ inputs.wheel-run-id }}
          github-token: ${{ github.token }}
          name: study-windows-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/study/reused
      - name: Validate repaired wheel and CMake consumers
        shell: pwsh
        env:
          STUDY_ROOT: ${{ runner.temp }}/study
          STUDY_TESTS: ${{ matrix.platform.tests }}
          STUDY_WHEEL_RUN: ${{ inputs.wheel-run-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE/scripts/toolchain/windows/common.ps1"
          Enter-VisualStudioDevShell -VsArch (Get-ArchInfo).VsArch
          Ensure-Ninja
          $sdk = "$env:STUDY_ROOT/sdk"
          New-Item -ItemType Directory -Force $sdk | Out-Null
          $archive = (Get-ChildItem "$env:STUDY_ROOT/download/*.tar.zst").FullName
          Invoke-Checked -Command python -Arguments @('experiments/extract_study_sdk.py', $archive, $sdk) -ErrorMessage 'SDK extraction failed'
          uv export --project core --frozen --no-default-groups --group build --no-emit-project --no-hashes --output-file "$env:STUDY_ROOT/build-requirements.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency export failed' }
          Invoke-Checked -Command uv -Arguments @('pip', 'sync', "$env:STUDY_ROOT/build-requirements.txt") -ErrorMessage 'Build dependency installation failed'
          Invoke-Checked -Command uv -Arguments @('pip', 'install', 'delvewheel==1.12.0') -ErrorMessage 'Wheel repair dependency installation failed'
          $arguments = @('experiments/validate_windows_sdk.py', '--core', "$env:GITHUB_WORKSPACE/core", '--root', "$env:STUDY_ROOT/output", '--sdk', $sdk)
          if ($env:STUDY_WHEEL_RUN) {
            $wheels = @(Get-ChildItem "$env:STUDY_ROOT/reused" -Filter *.whl -Recurse)
            if ($wheels.Count -ne 1) { throw 'Expected exactly one repaired wheel' }
            $arguments += @('--wheel', $wheels[0].FullName)
          }
          if ($env:STUDY_TESTS) { $arguments += $env:STUDY_TESTS }
          Invoke-Checked -Command python -Arguments $arguments -ErrorMessage 'Windows compatibility check failed'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-windows-${{ matrix.platform.arch }}
          path: |
            ${{ runner.temp }}/study/output/compatibility.json
            ${{ runner.temp }}/study/output/measurements
            ${{ runner.temp }}/study/output/artifacts
            ${{ runner.temp }}/study/output/test-requirements.txt
            ${{ runner.temp }}/study/build-requirements.txt
          if-no-files-found: error
