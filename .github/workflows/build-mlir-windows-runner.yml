name: Build Portable MLIR Toolchain (Windows Runner)

on:
  workflow_call:
    inputs:
      llvm-project-ref:
        description: "llvm-project ref or tag (e.g., llvmorg-23.1.2)"
        required: true
        type: string
      runs-on:
        description: "GitHub runner label (e.g., windows-2025)"
        required: true
        type: string
      zstd-version:
        description: "zstd version (e.g., 1.5.7)"
        default: "1.5.7"
        required: false
        type: string
      ninja-version:
        description: "ninja version (e.g., 1.13.0)"
        default: "1.13.0"
        required: false
        type: string

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  ZSTD_ARCHIVE_PATH: zstd-${{ inputs.zstd-version }}_${{ inputs.runs-on == 'windows-2025' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}.tar.gz
  LLD_ARCHIVE_PATH: lld-${{ inputs.llvm-project-ref }}_${{ inputs.runs-on == 'windows-2025' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}.tar.zst

jobs:
  build-zstd:
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build zstd"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Build zstd (Release)
        shell: pwsh
        env:
          NINJA_VERSION: ${{ inputs.ninja-version }}
          ZSTD_VERSION: ${{ inputs.zstd-version }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\build-zstd.ps1" `
            -ZstdArchivePath $env:ZSTD_ARCHIVE_PATH `
            -NinjaVersion $env:NINJA_VERSION `
            -ZstdVersion $env:ZSTD_VERSION
      - name: Upload zstd executable (final payload)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZSTD_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  build-lld:
    needs: build-zstd
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Download zstd executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Build lld (Release) with zstd
        shell: pwsh
        env:
          LLVM_PROJECT_REF: ${{ inputs.llvm-project-ref }}
          NINJA_VERSION: ${{ inputs.ninja-version }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\build-lld.ps1" `
            -LlvmProjectRef $env:LLVM_PROJECT_REF `
            -ZstdArchivePath $env:ZSTD_ARCHIVE_PATH `
            -LldArchivePath $env:LLD_ARCHIVE_PATH `
            -NinjaVersion $env:NINJA_VERSION
      - name: Upload lld installation (temporary)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.LLD_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  build-mlir-release:
    needs: [build-lld]
    strategy:
      fail-fast: false
      matrix:
        assertions: ["ON", "OFF"]
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build MLIR (Release, assertions=${{ matrix.assertions }})"
    env:
      LLVM_ENABLE_ASSERTIONS: ${{ matrix.assertions }}
      MLIR_ARCHIVE_PATH: llvm-mlir_${{ inputs.llvm-project-ref }}_${{ inputs.runs-on == 'windows-2025' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}${{ matrix.assertions == 'OFF' && '_noassert' || '' }}.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free up space on runner
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\cleanup-runner.ps1"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Download zstd executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Download lld installation archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.LLD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Build and package MLIR (Release)
        shell: pwsh
        env:
          LLVM_PROJECT_REF: ${{ inputs.llvm-project-ref }}
          NINJA_VERSION: ${{ inputs.ninja-version }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\build-mlir.ps1" `
            -LlvmProjectRef $env:LLVM_PROJECT_REF `
            -ZstdArchivePath $env:ZSTD_ARCHIVE_PATH `
            -LldArchivePath $env:LLD_ARCHIVE_PATH `
            -MlirArchivePath $env:MLIR_ARCHIVE_PATH `
            -NinjaVersion $env:NINJA_VERSION
      - name: Upload MLIR archive (Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.MLIR_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  test-release:
    needs: [build-mlir-release]
    strategy:
      fail-fast: false
      matrix:
        assertions: ["ON", "OFF"]
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Test MLIR Installation (Release, assertions=${{ matrix.assertions }})"
    env:
      LLVM_ENABLE_ASSERTIONS: ${{ matrix.assertions }}
      MLIR_ARCHIVE_PATH: llvm-mlir_${{ inputs.llvm-project-ref }}_${{ inputs.runs-on == 'windows-2025' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}${{ matrix.assertions == 'OFF' && '_noassert' || '' }}.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Download zstd executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Download MLIR archive (Release)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.MLIR_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Test installation (Release)
        shell: pwsh
        env:
          NINJA_VERSION: ${{ inputs.ninja-version }}
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\toolchain\windows\test-installation.ps1" `
            -ZstdArchivePath $env:ZSTD_ARCHIVE_PATH `
            -MlirArchivePath $env:MLIR_ARCHIVE_PATH `
            -NinjaVersion $env:NINJA_VERSION
