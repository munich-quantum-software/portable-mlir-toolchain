name: Build Portable MLIR Toolchain (Linux Runner)

on:
  workflow_call:
    inputs:
      llvm-project-ref:
        description: "llvm-project ref or tag (e.g., llvmorg-23.1.4)"
        required: true
        type: string
      llvm-project-sha:
        description: "Resolved llvm-project commit to build"
        required: true
        type: string
      target:
        description: "Artifact target triple for the selected native runner"
        required: true
        type: string
      runs-on:
        description: "GitHub runner label (e.g., ubuntu-26.04)"
        required: true
        type: string
      zstd-version:
        description: "zstd version (e.g., 1.5.7)"
        default: "1.5.7"
        required: false
        type: string
      mold-version:
        description: "mold version (e.g., 3.0.0)"
        default: "3.0.0"
        required: false
        type: string

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  ZSTD_ARCHIVE_PATH: zstd-${{ inputs.zstd-version }}_${{ inputs.target }}.tar.gz
  MOLD_ARCHIVE_PATH: mold-${{ inputs.mold-version }}_${{ inputs.target }}.tar.zst

jobs:
  build-zstd:
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build zstd"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build zstd
        env:
          ZSTD_VERSION: ${{ inputs.zstd-version }}
        run: |
          bash "$GITHUB_WORKSPACE"/scripts/toolchain/linux/build-zstd.sh \
            -a "$ZSTD_ARCHIVE_PATH" \
            -v "$ZSTD_VERSION"
      - name: Upload zstd executable (final payload)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZSTD_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  build-mold:
    needs: build-zstd
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download zstd executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Build mold
        env:
          MOLD_VERSION: ${{ inputs.mold-version }}
        run: |
          bash "$GITHUB_WORKSPACE"/scripts/toolchain/linux/build-mold.sh \
            -z "$ZSTD_ARCHIVE_PATH" \
            -a "$MOLD_ARCHIVE_PATH" \
            -v "$MOLD_VERSION"
      - name: Upload mold installation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.MOLD_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  build-mlir-release:
    needs: [build-mold]
    strategy:
      fail-fast: false
      matrix:
        assertions: ["ON", "OFF"]
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build MLIR (Release, assertions=${{ matrix.assertions }})"
    env:
      LLVM_ENABLE_ASSERTIONS: ${{ matrix.assertions }}
      MLIR_ARCHIVE_PATH: llvm-mlir_${{ inputs.llvm-project-ref }}_${{ inputs.target }}${{ matrix.assertions == 'OFF' && '_noassert' || '' }}.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download zstd executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Download mold installation archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.MOLD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Build and package MLIR (Release)
        env:
          LLVM_PROJECT_REF: ${{ inputs.llvm-project-sha }}
        run: |
          bash "$GITHUB_WORKSPACE"/scripts/toolchain/linux/build-mlir.sh \
            -r "$LLVM_PROJECT_REF" \
            -z "$ZSTD_ARCHIVE_PATH" \
            -m "$MOLD_ARCHIVE_PATH" \
            -a "$MLIR_ARCHIVE_PATH" \
            -b Release
      - name: Upload MLIR archive (Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.MLIR_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  test-release:
    needs: [build-mlir-release]
    strategy:
      fail-fast: false
      matrix:
        assertions: ["ON", "OFF"]
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Test MLIR Installation (Release, assertions=${{ matrix.assertions }})"
    env:
      LLVM_ENABLE_ASSERTIONS: ${{ matrix.assertions }}
      MLIR_ARCHIVE_PATH: llvm-mlir_${{ inputs.llvm-project-ref }}_${{ inputs.target }}${{ matrix.assertions == 'OFF' && '_noassert' || '' }}.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download zstd executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Download MLIR archive (Release)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.MLIR_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Test installation (Release)
        run: |
          bash "$GITHUB_WORKSPACE"/scripts/toolchain/linux/test-installation.sh \
            -z "$ZSTD_ARCHIVE_PATH" \
            -a "$MLIR_ARCHIVE_PATH" \
            -b Release
