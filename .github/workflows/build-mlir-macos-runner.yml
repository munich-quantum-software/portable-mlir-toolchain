name: Build Portable MLIR Toolchain (macOS Runner)

on:
  workflow_call:
    inputs:
      llvm-project-ref:
        description: "llvm-project ref or tag (e.g., llvmorg-23.1.2)"
        required: true
        type: string
      runs-on:
        description: "GitHub runner label (e.g., macos-26)"
        required: true
        type: string
      zstd-version:
        description: "zstd version (e.g., 1.5.7)"
        default: "1.5.7"
        required: false
        type: string
      ninja-version:
        description: "ninja version (e.g., 1.13.0)"
        default: "1.13.0"
        required: false
        type: string

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  ZSTD_ARCHIVE_PATH: zstd-${{ inputs.zstd-version }}_arm64-apple-darwin.tar.gz

jobs:
  build-zstd:
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build zstd"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Build zstd
        env:
          ZSTD_VERSION: ${{ inputs.zstd-version }}
          NINJA_VERSION: ${{ inputs.ninja-version }}
        run: |
          bash "$GITHUB_WORKSPACE"/scripts/toolchain/macos/build-zstd.sh \
            -a "$ZSTD_ARCHIVE_PATH" \
            -v "$ZSTD_VERSION" \
            -n "$NINJA_VERSION"
      - name: Upload zstd executable (final payload)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZSTD_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  build-mlir-release:
    needs: [build-zstd]
    strategy:
      fail-fast: false
      matrix:
        assertions: ["ON", "OFF"]
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Build MLIR (Release, assertions=${{ matrix.assertions }})"
    env:
      LLVM_ENABLE_ASSERTIONS: ${{ matrix.assertions }}
      MLIR_ARCHIVE_PATH: llvm-mlir_${{ inputs.llvm-project-ref }}_arm64-apple-darwin${{ matrix.assertions == 'OFF' && '_noassert' || '' }}.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Download zstd executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Build and package MLIR (Release)
        env:
          LLVM_PROJECT_REF: ${{ inputs.llvm-project-ref }}
          NINJA_VERSION: ${{ inputs.ninja-version }}
        run: |
          bash "$GITHUB_WORKSPACE"/scripts/toolchain/macos/build-mlir.sh \
            -r "$LLVM_PROJECT_REF" \
            -z "$ZSTD_ARCHIVE_PATH" \
            -a "$MLIR_ARCHIVE_PATH" \
            -n "$NINJA_VERSION" \
            -b Release
      - name: Upload MLIR archive (Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.MLIR_ARCHIVE_PATH }}
          if-no-files-found: error
          archive: false

  test-release:
    needs: [build-mlir-release]
    strategy:
      fail-fast: false
      matrix:
        assertions: ["ON", "OFF"]
    runs-on: ${{ inputs.runs-on }}
    name: "${{ inputs.runs-on }}: Test MLIR Installation (Release, assertions=${{ matrix.assertions }})"
    env:
      LLVM_ENABLE_ASSERTIONS: ${{ matrix.assertions }}
      MLIR_ARCHIVE_PATH: llvm-mlir_${{ inputs.llvm-project-ref }}_arm64-apple-darwin${{ matrix.assertions == 'OFF' && '_noassert' || '' }}.tar.zst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.14
          activate-environment: true
          enable-cache: false
      - name: Download zstd executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ZSTD_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Download MLIR archive (Release)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.MLIR_ARCHIVE_PATH }}
          skip-decompress: true
      - name: Test installation (Release)
        env:
          NINJA_VERSION: ${{ inputs.ninja-version }}
        run: |
          bash "$GITHUB_WORKSPACE"/scripts/toolchain/macos/test-installation.sh \
            -z "$ZSTD_ARCHIVE_PATH" \
            -a "$MLIR_ARCHIVE_PATH" \
            -n "$NINJA_VERSION" \
            -b Release
