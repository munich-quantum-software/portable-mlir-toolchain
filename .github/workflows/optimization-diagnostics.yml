name: SDK study diagnostic checks

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "macOS diagnostic to run when sdk-run-id is empty"
        type: choice
        options: [wheel, profile, core-profile]
        default: wheel
      sdk-run-id:
        description: "Validate retained Linux SDK archives; empty diagnoses the macOS Core wheel"
        type: string
        default: ""
  push:
    branches: [codex/optimized-release-toolchain]
    paths: [.github/workflows/optimization-diagnostics.yml]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.sdk-run-id == '' && inputs.diagnostic != 'profile'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: munich-quantum-toolkit/core
          fetch-depth: 0
          ref: 9e776ddb4bd1d9eede04a08cb814394367a84884
          path: core
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: "34535974767"
          github-token: ${{ github.token }}
          name: study-sdk-macos-arm64-OFF
          path: ${{ runner.temp }}/study/download
      - name: Validate the Core wheel with retained diagnostic output
        shell: bash
        env:
          STUDY_ROOT: ${{ runner.temp }}/study
          STUDY_OPERATION: wheel
          STUDY_SDK_LTO: "OFF"
          STUDY_CORE_LTO: "OFF"
          STUDY_PGO: ${{ inputs.diagnostic == 'core-profile' && 'core' || 'none' }}
          STUDY_JOBS: "3"
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          if os.environ['STUDY_PGO'] == 'core':
              path = Path('core/cmake/AddMQTPythonBinding.cmake')
              source = path.read_text()
              old = 'if(APPLE)'
              assert source.count(old) == 1
              path.write_text(source.replace(old, old + '\n    target_link_options(${target_name} PRIVATE "LINKER:-twolevel_namespace")'))
          else:
              path = Path('core/mlir/bench/CMakeLists.txt')
              with path.open('a') as stream:
                  stream.write('\ntarget_link_options(mqt-core-bench PRIVATE "-Wl,-map,${CMAKE_CURRENT_BINARY_DIR}/mqt-core-bench.map")\n')
          PYTHON
          git -C core diff > "$STUDY_ROOT/diagnostic.patch"
          set +e
          python3 experiments/linux_optimization.py --output "$STUDY_ROOT/pipeline.json" -- bash experiments/run.sh
          study_status=$?
          set -e
          python3 - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['STUDY_ROOT'])
          build = root / 'output/core-build'
          paths = [build / 'mlir/bench/mqt-core-bench', *sorted((build / 'mlir/bench').rglob('*.o')),
                   *sorted((build / 'src/bench').glob('*.dylib')),
                   *sorted((build / 'bindings').rglob('*.so')), *sorted((build / 'bindings').rglob('*.o'))]
          with (root / 'symbols.log').open('w') as stream:
              for path in paths:
                  if path.is_file():
                      print(path, file=stream, flush=True)
                      subprocess.run(['xcrun', 'nm', '-m', str(path)], stdout=stream, stderr=subprocess.STDOUT, check=True)
          with (root / 'dependencies.log').open('w') as stream:
              for path in paths:
                  if path.is_file() and path.suffix in {'.so', '.dylib', ''}:
                      subprocess.run(['otool', '-L', str(path)], stdout=stream, stderr=subprocess.STDOUT, check=True)
          PYTHON
          exit "$study_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-macos-cli-diagnostic
          path: |
            ${{ runner.temp }}/study/diagnostic.patch
            ${{ runner.temp }}/study/*.log
            ${{ runner.temp }}/study/output/core-build/mlir/bench
            ${{ runner.temp }}/study/output/core-build/bindings
            ${{ runner.temp }}/study/output/core-build/src/bench/*.dylib
            ${{ runner.temp }}/study/pipeline.*
            ${{ runner.temp }}/study/output/measurements
            ${{ runner.temp }}/study/output/core-build/profile-test-results
            ${{ runner.temp }}/study/output/core-build/compile_commands.json
            ${{ runner.temp }}/study/output/core-build/build.ninja
            ${{ runner.temp }}/study/output/core-build/mlir/unittests/Compiler/mqt-core-mlir-unittests-compiler
            ${{ runner.temp }}/study/output/raw
          if-no-files-found: error

  profile-import:
    if: github.event_name == 'workflow_dispatch' && inputs.sdk-run-id == '' && inputs.diagnostic == 'profile'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce profiled module loading with nanobind's linker flags
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          PROFILE_ROOT: ${{ runner.temp }}/profile-import
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['PROFILE_ROOT'])
          root.mkdir()
          source = root / 'module.cpp'
          source.write_text('static int value() { return 42; }\n'
                            'static int (*volatile callback)() = value;\n'
                            'extern "C" __attribute__((visibility("default"))) int PyInit_dd() { return callback(); }\n')
          compiler = subprocess.check_output(['xcrun', '--find', 'clang++'], text=True).strip()
          sdk = subprocess.check_output(['xcrun', '--show-sdk-path'], text=True).strip()
          results = {'compiler': compiler,
                     'compiler_sha256': hashlib.file_digest(open(compiler, 'rb'), 'sha256').hexdigest(),
                     'compiler_version': subprocess.check_output([compiler, '--version'], text=True),
                     'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True), 'variants': {}}
          export = ['-Wl,-exported_symbol,_PyInit_dd']
          strip = ['-Wl,-dead_strip', '-Wl,-x', '-Wl,-S']
          flat = ['-Wl,-flat_namespace']
          variants = {'ir-plain': (['-fprofile-generate'], []),
                      'ir-strip': (['-fprofile-generate'], strip),
                      'ir-export': (['-fprofile-generate'], export),
                      'ir-export-strip': (['-fprofile-generate'], export + strip),
                      'ir-export-dead-strip': (['-fprofile-generate'], export + ['-Wl,-dead_strip']),
                      'frontend-export-strip': (['-fprofile-instr-generate'], export + strip),
                      'ir-flat': (['-fprofile-generate'], flat),
                      'ir-flat-export': (['-fprofile-generate'], flat + export),
                      'ir-flat-export-strip': (['-fprofile-generate'], flat + export + strip),
                      'ir-flat-then-twolevel': (['-fprofile-generate'], flat + ['-Wl,-twolevel_namespace'] + export + strip),
                      'frontend-flat-export-strip': (['-fprofile-instr-generate'], flat + export + strip)}
          for name, (profile, link) in variants.items():
              output = root / (name + '.so')
              command = [compiler, '-isysroot', sdk, '-O3', '-std=c++20', '-mmacosx-version-min=13.3', '-fvisibility=hidden',
                         '-fprofile-update=atomic', *profile, '-bundle', '-undefined', 'dynamic_lookup',
                         str(source), *link, '-o', str(output)]
              build = subprocess.run(command, capture_output=True, text=True)
              result = {'command': command, 'build_status': build.returncode,
                        'build_stdout': build.stdout, 'build_stderr': build.stderr}
              if build.returncode == 0:
                  (root / (name + '-symbols.log')).write_text(subprocess.check_output(
                      ['xcrun', 'nm', '-m', str(output)], text=True))
                  env = dict(os.environ, LLVM_PROFILE_FILE=str(root / (name + '-%m-%p.profraw')))
                  load = subprocess.run([sys.executable, '-c',
                      'import ctypes, sys; assert ctypes.CDLL(sys.argv[1]).PyInit_dd() == 42', str(output)],
                      env=env, capture_output=True, text=True)
                  result.update(load_status=load.returncode, load_stdout=load.stdout, load_stderr=load.stderr,
                                sha256=hashlib.file_digest(open(output, 'rb'), 'sha256').hexdigest())
              results['variants'][name] = result
          (root / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          assert all(v['build_status'] == 0 for v in results['variants'].values())
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-macos-profile-import
          path: ${{ runner.temp }}/profile-import
          if-no-files-found: error

  validate-linux-sdk:
    if: github.event_name == 'workflow_dispatch' && inputs.sdk-run-id != ''
    strategy:
      fail-fast: false
      matrix:
        assertions: ["ON", "OFF"]
        platform:
          - { runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
          - { runner: ubuntu-24.04, triple: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    env:
      LLVM_ENABLE_ASSERTIONS: ${{ matrix.assertions }}
      SDK_ARCHIVE: llvm-mlir_llvmorg-23.1.0_${{ matrix.platform.triple }}${{ matrix.assertions == 'OFF' && '_noassert' || '' }}.tar.zst
      ZSTD_ARCHIVE: zstd-1.5.7_${{ matrix.platform.triple }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          python-version: 3.14.7
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.sdk-run-id }}
          github-token: ${{ github.token }}
          name: ${{ env.SDK_ARCHIVE }}
          path: ${{ runner.temp }}/sdk-validation
          skip-decompress: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.sdk-run-id }}
          github-token: ${{ github.token }}
          name: ${{ env.ZSTD_ARCHIVE }}
          path: ${{ runner.temp }}/sdk-validation
          skip-decompress: true
      - name: Run the updated installation and BOLT checks
        env:
          STUDY_ROOT: ${{ runner.temp }}/sdk-validation
        run: |
          uv pip install cmake==4.4.3 ninja==1.13.0
          mkdir -p "$STUDY_ROOT/records"
          sha256sum "$STUDY_ROOT/$SDK_ARCHIVE" "$STUDY_ROOT/$ZSTD_ARCHIVE" > "$STUDY_ROOT/records/inputs.sha256"
          python experiments/linux_optimization.py --output "$STUDY_ROOT/records/validate.json" -- \
            bash scripts/toolchain/linux/test-installation.sh \
            -a "$STUDY_ROOT/$SDK_ARCHIVE" -z "$STUDY_ROOT/$ZSTD_ARCHIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-sdk-validation-${{ matrix.platform.triple }}-${{ matrix.assertions }}
          path: ${{ runner.temp }}/sdk-validation/records
          if-no-files-found: error
