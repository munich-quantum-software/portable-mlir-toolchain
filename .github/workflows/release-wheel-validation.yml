name: Validate the integrated release wheel recipe

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to qualify with the retained SDK artifacts
        type: choice
        options: [linux, macos, windows]
        default: linux
      sdk-run-id:
        description: Native LLVM 23.1.1 qualification artifacts
        type: string
        required: true
      core-ref:
        description: Exact Core integration commit
        type: string
        required: true
  push:
    branches: [codex/release-wheel-validation]
    paths: [.github/workflows/release-wheel-validation.yml]

permissions:
  contents: read
  actions: read

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'linux'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
        abi: [cp311, cp315t]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: munich-quantum-toolkit/core
          ref: ${{ inputs.core-ref }}
          path: core
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          python-version: 3.14.7
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.sdk-run-id }}
          github-token: ${{ github.token }}
          name: llvm-mlir_llvmorg-23.1.1_${{ matrix.platform.arch }}-unknown-linux-gnu_noassert.tar.zst
          path: ${{ runner.temp }}/release/download
          skip-decompress: true
      - name: Run the production cibuildwheel hooks with the retained SDK
        shell: bash
        env:
          RELEASE_ROOT: ${{ runner.temp }}/release
          CIBW_BUILD: ${{ matrix.abi }}-*
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          SCCACHE_GHA_ENABLED: "false"
        run: |
          mkdir -p "$RELEASE_ROOT/sdk" "$GITHUB_WORKSPACE/core/build"
          uv run --no-project --python 3.14.7 python experiments/extract_study_sdk.py \
            "$RELEASE_ROOT"/download/*.tar.zst "$RELEASE_ROOT/sdk"
          if [[ "$CIBW_BUILD" == cp311-* ]]; then
            cat > "$GITHUB_WORKSPACE/core/build/release-validation-cpp.sh" <<'CPP'
          set -euo pipefail
          project=${1:?Core source directory}
          build="$project/build/release-validation-cpp"
          cmake -S "$project" -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_UNITY_BUILD=ON -DBUILD_MQT_CORE_SHARED_LIBS=ON \
            -DBUILD_MQT_CORE_BINDINGS=OFF -DBUILD_MQT_CORE_TESTS=ON \
            -DCMAKE_PROJECT_INCLUDE_BEFORE="$project/build/release-pgo.cmake"
          cmake --build "$build" -j 4
          ctest --test-dir "$build" --output-on-failure -j 4
          CPP
            export CIBW_BEFORE_TEST_LINUX='uv run --no-project --python "$(command -v python)" --with cmake==4.4.3 --with ninja==1.13.0 bash "{project}/build/release-validation-cpp.sh" "{project}"'
          fi
          export CIBW_CONTAINER_ENGINE="docker; create_args: --cpus=4 --memory=16g --memory-swap=16g --label=mqt-release-validation -v$RELEASE_ROOT/sdk:/opt/llvm-23.1.1:ro -v$GITHUB_WORKSPACE/core/build:/project/build"
          cd core
          uv run --no-project --python 3.14.7 python ../experiments/linux_optimization.py \
            --output "$RELEASE_ROOT/pipeline.json" --container label=mqt-release-validation -- \
            uvx cibuildwheel==4.2.1 --platform linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-validation-${{ matrix.platform.arch }}-${{ matrix.abi }}
          compression-level: 0
          path: |
            core/wheelhouse/*.whl
            core/build/release-pgo-*/*.json
            core/build/release-pgo-*/*.log
            core/build/release-pgo-*/*.profdata
            core/build/release-pgo-*/sdk-build/variant-*.json
            core/build/release-validation-cpp/Testing/Temporary/*.log
            core/build/release-validation-cpp/CMakeCache.txt
            ${{ runner.temp }}/release/pipeline*
          if-no-files-found: error

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        python:
          - { abi: cp311, version: "3.11" }
          - { abi: cp315t, version: "3.15t" }
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: munich-quantum-toolkit/core
          ref: ${{ inputs.core-ref }}
          path: core
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          python-version: 3.14.7
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.sdk-run-id }}
          github-token: ${{ github.token }}
          name: llvm-mlir_llvmorg-23.1.1_arm64-apple-darwin_noassert.tar.zst
          path: ${{ runner.temp }}/release/download
          skip-decompress: true
      - name: Build and validate the production macOS wheel
        shell: bash
        env:
          RELEASE_ROOT: ${{ runner.temp }}/release
          RELEASE_PYTHON: ${{ matrix.python.version }}
          CIBW_BUILD: ${{ matrix.python.abi }}-*
          CIBW_ARCHS: arm64
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ROOT/sdk"
          uv run --no-project --python 3.14.7 python experiments/extract_study_sdk.py \
            "$RELEASE_ROOT"/download/*.tar.zst "$RELEASE_ROOT/sdk"
          export MLIR_DIR="$RELEASE_ROOT/sdk/lib/cmake/mlir" LLVM_DIR="$RELEASE_ROOT/sdk/lib/cmake/llvm"
          export PATH="$RELEASE_ROOT/sdk/bin:$HOME/.local/bin:$PATH"
          export MQT_CORE_QDMI_CONFIG_JSON='{"schema-version":1,"qdmi":{"devices":[]}}'
          uv tool install cmake==4.4.3
          uv tool install ninja==1.13.0
          cd core
          uv run --no-project --python 3.14.7 python ../experiments/linux_optimization.py \
            --output "$RELEASE_ROOT/pipeline.json" -- uvx cibuildwheel==4.2.1 --platform macos
          uv venv --python "$RELEASE_PYTHON" "$RELEASE_ROOT/installed"
          python="$RELEASE_ROOT/installed/bin/python"
          uv pip install --python "$python" wheelhouse/*.whl
          "$python" test/release/train_optimization.py --expected-root "$RELEASE_ROOT/installed"
          package=$("$python" -c 'from pathlib import Path; import mqt.core; print(Path(mqt.core.__file__).parent)')
          cmake -S test/release/consumer -B build/consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$package" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          cmake --build build/consumer -j 3
          build/consumer/consumer
          if [[ "$RELEASE_PYTHON" == 3.11 ]]; then
            arguments=(-DENABLE_IPO=ON)
            if [[ -f build/release-pgo.cmake ]]; then
              arguments+=(-DCMAKE_PROJECT_INCLUDE_BEFORE="$PWD/build/release-pgo.cmake")
            fi
            cmake --preset release "${arguments[@]}"
            cmake --build --preset release -j 3
            ctest --preset release
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-validation-macos-${{ matrix.python.abi }}
          compression-level: 0
          path: |
            core/wheelhouse/*.whl
            core/build/release-pgo-*/*.json
            core/build/release-pgo-*/*.log
            core/build/release-pgo-*/*.profdata
            core/build/release-pgo-*/sdk-build/variant-*.json
            core/build/consumer/CMakeCache.txt
            core/build/release/Testing/Temporary/*.log
            ${{ runner.temp }}/release/pipeline*
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'windows'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-2025, arch: x86_64, cibw: AMD64 }
          - { runner: windows-11-arm, arch: aarch64, cibw: ARM64 }
        python:
          - { abi: cp311, version: "3.11" }
          - { abi: cp315t, version: "3.15t" }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: munich-quantum-toolkit/core
          ref: ${{ inputs.core-ref }}
          path: core
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5
          python-version: 3.14.7
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.sdk-run-id }}
          github-token: ${{ github.token }}
          name: llvm-mlir_llvmorg-23.1.1_${{ matrix.platform.arch }}-pc-windows-msvc_noassert.tar.zst
          path: ${{ runner.temp }}/release/download
          skip-decompress: true
      - name: Build and validate the production Windows wheel
        shell: pwsh
        env:
          RELEASE_ROOT: ${{ runner.temp }}/release
          RELEASE_PYTHON: ${{ matrix.python.version }}
          CIBW_BUILD: ${{ matrix.python.abi }}-*
          CIBW_ARCHS: ${{ matrix.platform.cibw }}
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE/scripts/toolchain/windows/common.ps1"
          Enter-VisualStudioDevShell -VsArch (Get-ArchInfo).VsArch
          Ensure-Ninja
          $sdk = "$env:RELEASE_ROOT/sdk"
          New-Item -ItemType Directory -Force $sdk | Out-Null
          $archive = (Get-ChildItem "$env:RELEASE_ROOT/download/*.tar.zst").FullName
          Invoke-Checked -Command uv -Arguments @('run', '--no-project', '--python', '3.14.7', 'python', 'experiments/extract_study_sdk.py', $archive, $sdk) -ErrorMessage 'SDK extraction failed'
          $env:MLIR_DIR = "$sdk/lib/cmake/mlir"
          $env:LLVM_DIR = "$sdk/lib/cmake/llvm"
          $env:PATH = "$sdk/bin;$env:PATH"
          $env:MQT_CORE_QDMI_CONFIG_JSON = '{"schema-version":1,"qdmi":{"devices":[]}}'
          Set-Location core
          Invoke-Checked -Command uvx -Arguments @('cibuildwheel==4.2.1', '--platform', 'windows') -ErrorMessage 'Production wheel pipeline failed'
          $wheels = @(Get-ChildItem wheelhouse -Filter *.whl)
          if ($wheels.Count -ne 1) { throw 'Expected one repaired wheel' }
          $installed = "$env:RELEASE_ROOT/installed"
          Invoke-Checked -Command uv -Arguments @('venv', '--python', $env:RELEASE_PYTHON, $installed) -ErrorMessage 'Installed environment creation failed'
          $python = "$installed/Scripts/python.exe"
          Invoke-Checked -Command uv -Arguments @('pip', 'install', '--python', $python, $wheels[0].FullName) -ErrorMessage 'Repaired wheel installation failed'
          Invoke-Checked -Command $python -Arguments @('test/release/train_optimization.py', '--expected-root', $installed) -ErrorMessage 'Installed numerical, compiler, QIR and CLI checks failed'
          $package = "$installed/Lib/site-packages/mqt/core"
          $dllPaths = Get-ChildItem "$installed/Lib/site-packages" -Filter *.dll -Recurse | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          $env:PATH = ($dllPaths -join ';') + ';' + $env:PATH
          Invoke-Checked -Command uvx -Arguments @('--from', 'cmake==4.4.3', 'cmake', '-S', 'test/release/consumer', '-B', 'build/consumer', '-G', 'Ninja', '-DCMAKE_BUILD_TYPE=Release', "-DCMAKE_PREFIX_PATH=$package") -ErrorMessage 'Installed CMake consumer configure failed'
          Invoke-Checked -Command uvx -Arguments @('--from', 'cmake==4.4.3', 'cmake', '--build', 'build/consumer', '-j', '4') -ErrorMessage 'Installed CMake consumer build failed'
          Invoke-Checked -Command './build/consumer/consumer.exe' -Arguments @() -ErrorMessage 'Installed CMake consumer execution failed'
          if ($env:RELEASE_PYTHON -eq '3.11') {
            Invoke-Checked -Command uvx -Arguments @('--from', 'cmake==4.4.3', 'cmake', '--preset', 'release', '-DENABLE_IPO=OFF') -ErrorMessage 'C++ test configure failed'
            Invoke-Checked -Command uvx -Arguments @('--from', 'cmake==4.4.3', 'cmake', '--build', '--preset', 'release', '-j', '4') -ErrorMessage 'C++ test build failed'
            Invoke-Checked -Command uvx -Arguments @('--from', 'cmake==4.4.3', 'ctest', '--preset', 'release') -ErrorMessage 'C++ tests failed'
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-validation-windows-${{ matrix.platform.arch }}-${{ matrix.python.abi }}
          compression-level: 0
          path: |
            core/wheelhouse/*.whl
            core/build/consumer/CMakeCache.txt
            core/build/release/Testing/Temporary/*.log
          if-no-files-found: error
